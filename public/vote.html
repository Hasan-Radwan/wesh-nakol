<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta name="description" content="صوّت على وجبة اليوم مع عائلتك — بدون تسجيل." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { display: ['"Baloo Bhaijaan 2"','cursive'], body: ['Tajawal','sans-serif'] },
      colors: {
        tomato:{DEFAULT:'#E8452B',600:'#D63A22'}, saffron:{DEFAULT:'#F2A007'},
        herb:{DEFAULT:'#2FA84F',600:'#248B40'}, cream:'#FFF8F0',
        ink:{DEFAULT:'#20140F',soft:'#6B615A'},
      },
      borderRadius:{'4xl':'2rem'},
    } } };
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="font-body bg-cream text-ink antialiased">
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="blob blob-a"></div><div class="blob blob-c"></div>
  </div>

  <main class="mx-auto flex min-h-dvh max-w-md flex-col px-5 py-8">
    <a href="/" class="mb-6 flex items-center justify-center gap-2">
      <span class="grid h-9 w-9 place-items-center rounded-2xl bg-tomato text-white">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M5 11a7 7 0 0 1 14 0M2 20h20"/></svg>
      </span>
      <span class="font-display text-lg font-800">وش ناكل؟</span>
    </a>

    <div id="stage" class="flex-1"></div>

    <p class="mt-6 text-center text-xs text-ink-soft">صوت واحد لكل جهاز · تقدر تغيّر صوتك في أي وقت</p>
  </main>

  <div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-50 -translate-x-1/2 translate-y-4 rounded-2xl bg-ink px-5 py-3 text-sm font-700 text-cream opacity-0 shadow-card transition-all duration-300"></div>

  <script src="vote.js"></script>

</html>
